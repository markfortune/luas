name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # macos-latest runs on Apple Silicon
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jax
          # Latest tinygp from GitHub (the PyPI release is missing fixes luas needs)
          pip install "git+https://github.com/dfm/tinygp.git"
          pip install -e ".[test]"

      - name: Fast tests
        run: pytest -m "not slow"

      - name: Slow tests (gradients)
        run: pytest -m slow

  # Early warning for upcoming JAX changes; allowed to fail without blocking the PR
  latest-jax:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade jax
          pip install "git+https://github.com/dfm/tinygp.git"
          pip install -e ".[test]"
      - name: Tests
        run: pytest -m "not slow"
