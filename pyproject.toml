[project]
name = "luas"
version = "0.0.2"
description = "A library for implementing efficient 2D Gaussian processes"
authors = [{ name = "Mark Fortune", email = "markfortuneis@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "jax",
    "numpy",
    "scipy",
    "tinygp",
    "equinox",
    "matplotlib",
    "tqdm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"luas.kernels" = ["data/*"]

[project.optional-dependencies]
test = ["pytest"]
docs = [
    "numpy",
    "matplotlib",
    "tqdm",
    "jax", 
    "jaxlib",
    "scipy",
    "equinox",
    "astropy",
    "sphinx-book-theme",
    "myst-nb",
    "jaxoplanet",
    "numpyro",
    "pymc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slower tests such as gradient checks (deselect with -m \"not slow\")",
    "stress: stress tests of unusual but reasonable kernel usage (deselect with -m \"not stress\")",
]
