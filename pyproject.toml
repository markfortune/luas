[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "luas-gp"
version = "0.1.0"
description = "A library for implementing efficient 2D Gaussian processes"
authors = [{ name = "Mark Fortune", email = "markfortuneis@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"   # PyMC version 6 requires 3.12
license = "MIT"
license-files = ["LICENSE"]
# Minimum versions tested with full pytest run (Python 3.12, jax 0.4.38, numpy 1.26.4, scipy 1.11.4).
# Install tinygp from GitHub: the PyPI release is missing fixes luas needs.
dependencies = [
    "jax>=0.4.38",
    "numpy>=1.26.4",
    "scipy>=1.11.4",
    "tinygp>=0.3.1",
    "equinox",
    "matplotlib",
    "tqdm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Documentation = "https://luas.readthedocs.io"
Source = "https://github.com/markfortune/luas"
Issues = "https://github.com/markfortune/luas/issues"
Paper = "https://arxiv.org/abs/2611.09198"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["luas.redux*", "luas.kernels.experimental"]

[tool.setuptools.package-data]
"luas.kernels" = ["data/*"]

[project.optional-dependencies]
test = ["pytest", "jaxoplanet>=0.1.0", "astropy"]
exoplanet = ["jaxoplanet>=0.1.0", "astropy", "pymc>=6", "corner>=2.3", "numpyro"]
docs = [
    "luas-gp[exoplanet]",
    "sphinx-book-theme",
    "myst-nb",
    "numpyro",
    "pymc>=6",
    "corner>=2.3",
    "arviz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slower tests such as gradient checks (deselect with -m \"not slow\")",
    "stress: stress tests of unusual but reasonable kernel usage (deselect with -m \"not stress\")",
]
