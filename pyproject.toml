[project]
name = "luas"
version = "0.1.0"
description = "A library for implementing efficient 2D Gaussian processes"
authors = [{ name = "Mark Fortune", email = "markfortuneis@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"   # the GitHub version of tinygp requires 3.11
license = { text = "MIT" }
# Minimum versions tested with full pytest run (Python 3.11, jax 0.4.38, numpy 1.24, scipy 1.10).
# Install tinygp from GitHub: the PyPI release is missing fixes luas needs.
dependencies = [
    "jax>=0.4.38",
    "numpy>=1.24",
    "scipy>=1.10",
    "tinygp>=0.3.1",
    "equinox",
    "matplotlib",
    "tqdm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"luas.kernels" = ["data/*"]

[project.optional-dependencies]
test = ["pytest"]
exoplanet = ["jaxoplanet>=0.1.0", "astropy", "pymc>=6", "corner>=2.3", "numpyro"]
docs = [
    "luas[exoplanet]",
    "sphinx-book-theme",
    "myst-nb",
    "numpyro",
    "pymc>=6",
    "corner>=2.3",
    "arviz",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slower tests such as gradient checks (deselect with -m \"not slow\")",
    "stress: stress tests of unusual but reasonable kernel usage (deselect with -m \"not stress\")",
]
